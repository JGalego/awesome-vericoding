# Link checker settings, used by .github/workflows/links.yml (https://lychee.cli.rs).

max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 16

# 429 means "slow down", not "gone".
accept = ["200..=299", "429"]

# Publishers whose sites reject automated requests. DOIs are persistent
# identifiers, and these were verified against Crossref when added.
exclude = [
  '^https://doi\.org/10\.1145/', # ACM Digital Library
  '^https://doi\.org/10\.1561/', # Foundations and Trends
]
