name: Links

on:
  pull_request:
    paths: ["**.md", "lychee.toml"]
  schedule:
    - cron: "0 6 1 * *" # monthly, on the 1st
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress README.md contributing.md code-of-conduct.md
          # Fail pull requests; scheduled runs open an issue instead.
          fail: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open an issue for broken links
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links report
          content-filepath: ./lychee/out.md
          labels: broken-links
