<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="{{ '/media/logo.svg' | relative_url }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.6.1/github-markdown.css">
  <style>
    body { margin: 0; background: #fff; }
    .markdown-body { box-sizing: border-box; max-width: 980px; margin: 0 auto; padding: 45px 16px; }
    @media (prefers-color-scheme: dark) { body { background: #0d1117; } }
  </style>
</head>
<body>
  <main class="markdown-body">
    {{ content }}
  </main>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    document.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default" });
    await mermaid.run();
  </script>
</body>
</html>
